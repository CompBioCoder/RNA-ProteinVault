name: Fetch papers

on:
  schedule:
    - cron: "0 22 * * *"      # UTC 22:00 = 北京时间 06:00
  workflow_dispatch:           # Actions 页面手动 Run workflow

permissions:
  contents: write              # 需要在仓库 Settings → Actions → Workflow permissions 选 Read and write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r _paperbot/requirements.txt
      - run: python _paperbot/fetch_papers.py
      - run: python _paperbot/build_pages.py
      - name: Commit & push
        run: |
          git config user.name  "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing new today"
          else
            git commit -m "papers: $(date -u +%F)"
            git pull --rebase origin main
            git push origin main
          fi
